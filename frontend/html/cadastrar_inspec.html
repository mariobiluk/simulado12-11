<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/cadastrar_inscpec.js"defer></script>
    <title>Cadastro de Inspeção/Vistoria</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;
        </nav>
    </header>
    <main>
        <h1>Cadastrar Inspeção/Vistoria</h1>

        <form>
            <label for="status">Status</label>
            <select name="status" id="status">
                <option value="PENDENTE">PENDENTE</option>
                <option value="REALIZADA">REALIZADA</option>
            </select><br><br>

            <label for="data">Data da Inspeção/Vistoria</label>
            <input type="date" id="data" placeholder="data" required><br><br>

            <label for="idEquipamento">Código do Equipamento</label>
            <input type="text" id="idEquipamento" placeholder="idEquipamento" required><br><br>

            <button type="submit" id="btn_cad">Cadastrar</button>
        </form>

        <div id="resposta"></div>
    </main>
    
</body>
</html>
