<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/cadastrar_cliente.js"defer></script>
    <title>Cadastro de Cliente</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;
        </nav>
    </header>
    <main>
        <h1>Cadastrar Cliente</h1>

        <form>
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="nome" required><br><br>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="email" required><br><br>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="senha" required><br><br>

            <label for="cpf">CPF (Apenas Dígitos)</label>
            <input type="text" id="cpf" placeholder="cpf" required maxlength="11"><br><br>

            <button type="submit" id="btn_cad">Cadastrar</button>
        </form>

        <div id="resposta"></div>
    </main>
    
</body>
</html>
